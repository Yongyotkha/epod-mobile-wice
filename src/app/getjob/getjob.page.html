<ion-header>
  <ion-toolbar class="blues-nav">
    <ion-buttons slot="start" class="nav-content">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>รับงาน</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content style="background: #fff">
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-item class="search_input ion-no-padding">
          <ion-input
            class="searchBtn"
            type="text"
            placeholder="กรอกหมายเลขหรือสแกน"
            [(ngModel)]="textgetjob"
          ></ion-input>
          <button item-right (click)="onGetinfobytext()" *ngIf="textgetjob">
            <ion-icon
              ios="ios-add-circle-outline"
              md="md-add-circle-outline"
              class="fs-30"
            ></ion-icon>
          </button>
          <!--   <button
            item-right
            (click) = "startscanning()"
            *ngIf="!textgetjob"
          >
            <ion-icon
              ios="ios-qr-scanner"
              md="md-qr-scanner"
              class="fs-30"
            ></ion-icon>
          </button>-->
          <button
            item-right
            [routerLink]="['/getjob-qrscanner']"
            *ngIf="!textgetjob"
          >
            <ion-icon
              ios="ios-qr-scanner"
              md="md-qr-scanner"
              class="fs-30"
            ></ion-icon>
          </button>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div style="margin: 0.3rem" *ngIf="this.utilservice.getjoblist.length !== 0" hidden>
    <div class="ion-grid">
      <ion-row>
        <ion-col>
          <ion-text style="font-size: 20px">
            จำนวนจุดส่ง : {{this.countdrop}}
          </ion-text>
        </ion-col>
        <ion-col class="text-right">
          <ion-text style="font-size: 20px">
            Orders : {{this.countorder}}
          </ion-text>
        </ion-col>
      </ion-row>
    </div>
  </div>

  <div style="margin: 0.3rem">
    <div class="ion-grid">
      <ion-row hidden>
        <ion-col>
          <ion-text style="font-size: 20px">
            รายการ : {{ this.utilservice.getjoblist.length}}
          </ion-text>
        </ion-col>
      </ion-row>
    </div>
  </div>

  <!-- แสดงจำนวนบิล และ จำนวนสินค้า หลังจากแสกน -->
  <div class="bg-blue" hidden>
    <ion-grid class="ion-no-padding">
      <ion-row>
        <ion-col size="12">
          <div class="card-container">
            <div class="card-summary">
              <img src="./../../assets/imgs/bill.png" alt="" />
              จำนวน 4 บิล
            </div>
            <div class="card-summary">
              <img src="./../../assets/imgs/parcel.png" alt="" />
              จำนวน 20 ชิ้น
            </div>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>

  <!-- แสดงผลรายการ -->
  <div
    *ngIf="this.utilservice.getjoblist.length === 0"
    class="ion-text-center"
    style="font-size: 20px"
  >
    ไม่มีรายการ
  </div>

  <div
    *ngFor="let d of this.utilservice.getjoblist; let i=index"
    class="ion-text-wrap"
  >
    <h3 class="header-text">Truck Order : {{d.shipmentId}}</h3>
    <div class="ion-grid">
      <ion-row>
        <ion-col> จาก : {{d.from}} </ion-col>
        <ion-col> ไปยัง : {{d.to}} </ion-col>
      </ion-row>
      <ion-row>
        <ion-col> วันที่รับสินค้า : {{d.etd}} </ion-col>
      </ion-row>
      <ion-row>
        <!-- <ion-col> Remark </ion-col>
          <ion-col>
            <ion-button size="small" color="primary" (click)="openModal(i)">
              <fa-icon icon="eye"></fa-icon> </ion-button
          ></ion-col> -->
        <ion-col>
          Order &nbsp;
          <ion-button size="small" color="primary" (click)="openOrderModel(i)">
            <fa-icon icon="eye"></fa-icon>
          </ion-button>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col>
          <div class="hr"></div>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col col-6 offset-3 class="ion-text-right">
          <ion-button size="small" color="danger" (click)="delete_item(i)">
            <fa-icon icon="times"></fa-icon> </ion-button
        ></ion-col>
      </ion-row>
    </div>
  </div>
</ion-content>

<ion-footer no-shadow>
  <ion-toolbar position="bottom">
    <section class="full-width">
      <div
      *ngIf="this.utilservice.getjoblist.length === 0"
    >
      <ion-button
        [routerLink]="['/home']"
        routerDirection="forward"
        expand="full"
        color="primary"
        size="large"
        >กลับไปหน้าหลัก&nbsp;
      </ion-button>
    </div>
      <ion-button
        expand="full"
        color="success"
        (click)="submit_deliver();"
        [hidden]="!this.utilservice.getjoblist.length"
        size="large"
        >ยืนยันการรับงาน
      </ion-button>
    </section>
  </ion-toolbar>
</ion-footer>
