<ion-header>
</ion-header>

<ion-content style="background: #fff">
  <div class="profile-card-div">
    <ion-card class="home-card">
      <div class="home-header">
        <img src="{{blackLogo}}" class="whiteLogo slide-in logo">
      </div>
    </ion-card>
  </div>
  <div class="home-data-card">
    <div class="head-div">
      <h2 class="login"> เข้าสู่ระบบ</h2>
    </div>
    <form (ngSubmit)="login()" [formGroup]="loginForm">
      <ion-list class="login-box">
        <ion-item detail class="login-item">
          <span slot="start" class="custom-icon-personal-info-icon"></span>
          <ion-input type="text" class="loginInput" placeholder="บัญชีผู้ใช้งาน" formControlName="username" required>
          </ion-input>
        </ion-item>
        <ion-item detail class="login-item">
          <span slot="start" class="custom-icon-password-icon"></span>
          <ion-input [type]="showPassword ? 'text' : 'password'" placeholder="รหัสผ่าน" formControlName="password" required>
          </ion-input>
          <ion-icon slot="end" [name]="showPassword ? 'md-eye-off' : 'md-eye'" class="eye-icon" (click)="togglePassword()"></ion-icon>
        </ion-item>

        <ion-text color="danger">
          <p [class]="show_error_auth"></p>
        </ion-text>

        <ion-item lines="none" class="remember-item">
          <ion-checkbox slot="start" [(ngModel)]="rememberMe" [ngModelOptions]="{standalone: true}"></ion-checkbox>
          <ion-label class="remember-label">จำรหัสผ่าน</ion-label>
        </ion-item>

        <ion-button expand="block" class="loginButton" type="submit">เข้าสู่ระบบ </ion-button>
        <!-- <div class="register" (click)="register()">คุณยังไม่มีชื่อผู้ใช้งาน <span>สมัครสมาชิก</span> คลิก</div> -->
        <div class="versionText">Version {{this.utilservice.numberVersion}}</div>

      </ion-list>
    </form>
  </div>
</ion-content>
