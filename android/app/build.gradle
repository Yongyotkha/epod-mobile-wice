apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.tag.ePOD"
    compileSdk rootProject.ext.compileSdkVersion

    def hasReleaseSigningConfig = false

    signingConfigs {
        release {
            def readSigningValue = { String propKey, String envKey ->
                def envVal = System.getenv(envKey)
                if (envVal != null) {
                    envVal = envVal.trim()
                    if (!envVal.isEmpty() && !envVal.startsWith('PUT_YOUR_')) {
                        return envVal
                    }
                }

                def propVal = keystoreProperties.getProperty(propKey)
                if (propVal != null) {
                    propVal = propVal.trim()
                    if (!propVal.isEmpty() && !propVal.startsWith('PUT_YOUR_')) {
                        return propVal
                    }
                }

                return null
            }

            def storeFilePath = readSigningValue('storeFile', 'EPOD_STORE_FILE')
            if (storeFilePath == null || storeFilePath.trim().isEmpty()) {
                storeFilePath = rootProject.file('../my-release-key.keystore').absolutePath
            }

            def resolvedStoreFile = file(storeFilePath)
            def resolvedStorePassword = readSigningValue('storePassword', 'EPOD_STORE_PASSWORD')
            def resolvedKeyAlias = readSigningValue('keyAlias', 'EPOD_KEY_ALIAS')
            def resolvedKeyPassword = readSigningValue('keyPassword', 'EPOD_KEY_PASSWORD')

            storeFile resolvedStoreFile
            storePassword resolvedStorePassword
            keyAlias resolvedKeyAlias
            keyPassword resolvedKeyPassword

            hasReleaseSigningConfig = (resolvedStoreFile != null && resolvedStoreFile.exists()
                    && resolvedStorePassword != null && resolvedKeyAlias != null && resolvedKeyPassword != null)
        }
    }

    defaultConfig {
        applicationId "com.tag.ePOD"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 10014
        versionName "1.0.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            } else {
                logger.lifecycle('Release signing not configured; using debug keystore for release APK build.')
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
