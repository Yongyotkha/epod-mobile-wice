module.exports = "<ion-header>\n  <ion-toolbar class=\"blues-nav\">\n    <ion-title>นำส่ง</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content style=\"background: #fff\">\n  <ion-grid>\n    <ion-row>\n      <ion-col>\n        <div>\n          <ion-grid>\n            <ion-row class=\"header\">\n              <ion-col class=\"col\" size=\"2\">No</ion-col>\n              <ion-col class=\"col\" size=\"5\">Order No</ion-col>\n              <ion-col class=\"col\" size=\"5\">Shipping</ion-col>\n            </ion-row>\n            <ion-row class=\"row\" *ngFor=\"let result of orderdata;let idx = index\" >\n              <ion-col class=\"col\" size=\"2\">{{idx+1}}</ion-col>\n              <ion-col class=\"col\" size=\"5\">{{result.order_no}}</ion-col>\n              <ion-col class=\"col\" size=\"5\">\n                <ion-select value=\"success\">\n                  <ion-select-option value=\"success\">นำส่ง</ion-select-option>\n                  <ion-select-option value=\"failed\">ไม่นำส่ง</ion-select-option>\n                </ion-select>\n              </ion-col>\n            </ion-row>\n          </ion-grid>\n        </div>\n      </ion-col>\n    </ion-row>\n  </ion-grid>\n</ion-content>\n\n<ion-footer no-shadow>\n  <ion-grid>\n    <ion-row>\n      <ion-col>\n        <ion-button expand=\"full\" color=\"danger\" size=\"large\" (click)=\"dismissModal()\">\n          ยกเลิก\n        </ion-button>\n       \n      </ion-col>\n      <ion-col>\n        <ion-button expand=\"full\" color=\"primary\" size=\"large\" (click)=\"Deliver();\">\n          นำส่ง\n        </ion-button>\n      </ion-col>\n    </ion-row>\n  </ion-grid>\n</ion-footer>"
