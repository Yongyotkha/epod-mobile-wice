module.exports = "<ion-header translucent>\n  <ion-toolbar>\n    <ion-title>Modal Content</ion-title>\n    <ion-buttons slot=\"end\" hidden>\n      <ion-button (click)=\"close();\">Close <ion-icon name=\"close\" slot=\"end\"></ion-icon></ion-button>\n    </ion-buttons>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content fullscreen>\n  <ion-slides [options]=\"sliderOpts\">\n    <ion-slide>\n      <div class=\"swiper-zoom-container\">\n        <!--<img src=\"assets/imgs/{{img}}.jpg\" alt=\"{{img}}\"> -->\n           <img src=\"{{ 'data:image/jpeg;base64,' + img }}\" alt=\"\" >\n      </div>\n    </ion-slide>\n  </ion-slides>\n</ion-content>\n"
