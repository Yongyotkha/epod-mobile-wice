module.exports = "<ion-header>\n  <ion-toolbar class=\"blues-nav\">\n    <ion-title>เปลี่ยนรหัสผ่าน</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n\n<ion-content>\n  <ion-grid class=\"pd-5\">\n    <ion-row>\n      <div class=\"mt-5\">\n        <div class=\"list-profile\">\n          <div class=\"item-profile\">\n            <ion-item>\n              <ion-label position=\"stacked\">รหัสผ่านใหม่</ion-label>\n              <ion-input [(ngModel)]='this.repassword'></ion-input>\n            </ion-item>\n          </div>\n        </div>\n        <div class=\"list-profile\">\n          <div class=\"item-profile\">\n            <ion-item>\n              <ion-label position=\"stacked\">ยืนยันรหัสผ่าน</ion-label>\n              <ion-input [(ngModel)]='this.confirmpassword'></ion-input>\n            </ion-item>\n          </div>\n        </div>\n      </div>\n    </ion-row>\n  </ion-grid>\n</ion-content>\n\n\n<ion-footer no-shadow>\n  <ion-grid>\n    <ion-row>\n      <ion-col>\n        <ion-button expand=\"full\" color=\"danger\" size=\"large\" (click)=\"Home()\">\n          ปิด\n        </ion-button>\n      </ion-col>\n      <ion-col>\n        <ion-button expand=\"full\" color=\"primary\" size=\"large\" (click)=\"SavePassword()\">\n          บันทึก\n        </ion-button>\n      </ion-col>\n    </ion-row>\n  </ion-grid>\n</ion-footer>\n\n<!-- <ion-header>\n  <ion-toolbar>\n    <ion-title>\n      WebView Example\n    </ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n  <ion-button (click)=\"openWebView()\">Open WebView</ion-button>\n</ion-content> -->"
