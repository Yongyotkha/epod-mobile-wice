module.exports = "<ion-header>\n  <ion-toolbar >\n    <ion-title>success-model</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content style=\"background: #fff\">\n  <ion-grid>\n    <ion-row>\n      <ion-col>\n        <ion-text style=\"font-size: 50px;\">ขอบคุณครับ</ion-text>\n      </ion-col>\n    </ion-row>\n    <ion-row>\n      <ion-col>\n        <fa-icon style=\"color: chartreuse;  font-size: 200px;\" icon=\"check-circle\"> </fa-icon>\n      </ion-col>\n    </ion-row>\n    <ion-row>\n      <ion-col>\n        <ion-text  style=\"font-size: 50px;\">บันทึกสำเร็จ</ion-text>\n      </ion-col>\n    </ion-row>\n  </ion-grid>\n\n\n</ion-content>\n<ion-footer no-shadow>\n  <ion-toolbar position=\"bottom\">\n    <section class=\"full-width\">\n      <ion-button\n        (click)=\"dismissModal();\"\n        expand=\"full\"\n        size=\"large\"\n        color=\"danger\"\n        >กลับไปหน้าหลัก</ion-button\n      >\n    </section>\n  </ion-toolbar>\n</ion-footer>"
