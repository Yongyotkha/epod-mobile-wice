module.exports = "<ion-app>\n  <!-- <ion-split-pane contentId=\"main-content\"> -->\n  <ion-menu contentId=\"main-content\" type=\"overlay\">\n    <ion-list-header>\n      <ion-label class=\"my-label-name\" style=\"display: flex; align-items: center\">\n        <ion-avatar class=\"avatar-icon\">\n          <ion-img src=\"{{ util.driverInfo.image }}\"></ion-img>\n        </ion-avatar>\n        <div>\n          ชื่อ:{{ util.driverInfo.firstName }} {{ util.driverInfo.lastName }}\n        </div>\n      </ion-label>\n    </ion-list-header>\n    <ion-content class=\"cus-menu-content\">\n      <ion-list class=\"list-content\">\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngFor=\"let menu of menus; let i = index\">\n            <ion-item [routerDirection]=\"'navigate'\" [routerLink]=\"[menu.url]\" lines=\"none\" class=\"nav-content\"\n              (click)=\"onLogout(i)\">\n              <!-- <ion-icon color=\"{{menu.color}}\" ios=\"{{menu.icon_ios}}\" md=\"{{menu.md}}\"></ion-icon> -->\n              <ion-label class=\"my-label-title\">\n                {{ menu.title }}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n\n        <!-- <ion-menu-toggle auto-hide=\"false\">\n          <div *ngFor=\"let p of pages1\">\n            <ion-item [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\" class=\"nav-content\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n        <ion-item (click)=\"openSub('employees')\" class=\"nav-content\" lines=\"none\">\n          <ion-label>\n            Employees\n          </ion-label>\n          <ion-icon class=\"nav-content\" [name]=\"subPage['employees'] ?'arrow-down':'arrow-forward'\" item-end>\n          </ion-icon>\n        </ion-item>\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngIf=\"subPage['employees']\">\n            <ion-item [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\" class=\"nav-content sub-menu\"\n              *ngFor=\"let p of employees\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngFor=\"let p of pages2\">\n            <ion-item [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\" class=\"nav-content\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n        <ion-item (click)=\"openSub('calls')\" class=\"nav-content\" lines=\"none\">\n          <ion-label>\n            Calls\n          </ion-label>\n          <ion-icon class=\"nav-content\" [name]=\"subPage['calls'] ?'arrow-down':'arrow-forward'\" item-end>\n          </ion-icon>\n        </ion-item>\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngIf=\"subPage['calls']\">\n            <ion-item *ngFor=\"let p of calls\" [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\"\n              class=\"nav-content sub-menu\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n        <ion-item (click)=\"openSub('accounts')\" class=\"nav-content\" lines=\"none\">\n          <ion-label>\n            Accounts\n          </ion-label>\n          <ion-icon class=\"nav-content\" [name]=\"subPage['accounts'] ?'arrow-down':'arrow-forward'\" item-end>\n          </ion-icon>\n        </ion-item>\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngIf=\"subPage['accounts']\">\n            <ion-item *ngFor=\"let p of accounts\" [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\"\n              class=\"nav-content sub-menu\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n        <ion-item (click)=\"openSub('payroll')\" class=\"nav-content\" lines=\"none\">\n          <ion-label>\n            Payroll\n          </ion-label>\n          <ion-icon class=\"nav-content\" [name]=\"subPage['payroll'] ?'arrow-down':'arrow-forward'\" item-end>\n          </ion-icon>\n        </ion-item>\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngIf=\"subPage['payroll']\">\n            <ion-item *ngFor=\"let p of payroll\" [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\"\n              class=\"nav-content sub-menu\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngFor=\"let p of pages3\">\n            <ion-item [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\" class=\"nav-content\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n        <ion-item (click)=\"openSub('pages')\" class=\"nav-content\" lines=\"none\">\n          <ion-label>\n            Pages\n          </ion-label>\n          <ion-icon class=\"nav-content\" [name]=\"subPage['pages'] ?'arrow-down':'arrow-forward'\" item-end>\n          </ion-icon>\n        </ion-item>\n        <ion-menu-toggle auto-hide=\"false\">\n          <div *ngIf=\"subPage['pages']\">\n            <ion-item *ngFor=\"let p of pages\" [routerDirection]=\"'forward'\" [routerLink]=\"[p.url]\" lines=\"none\"\n              class=\"nav-content sub-menu\">\n              <ion-label>\n                {{p.title}}\n              </ion-label>\n            </ion-item>\n          </div>\n        </ion-menu-toggle>\n         -->\n      </ion-list>\n    </ion-content>\n\n    <ion-footer no-shadow> <ion-text class=\"ion-text-center\" style=\"padding-left: 10px;\">Version\n        {{this.util.numberVersion}}</ion-text> </ion-footer>\n  </ion-menu>\n  <ion-router-outlet id=\"main-content\"></ion-router-outlet>\n  <!-- </ion-split-pane> -->\n</ion-app>"
