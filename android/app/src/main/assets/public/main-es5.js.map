module.exports = "<ion-header>\n  <ion-toolbar class=\"blues-nav\">\n    <ion-buttons slot=\"end\" hidden>\n      <ion-button (click)=\"dismissModal()\" color=\"light\">Close</ion-button>\n    </ion-buttons>\n    <ion-title>Order</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content style=\"background: #fff\">\n  <ion-grid>\n    <ion-row>\n      <ion-col>\n        <div>\n          <ion-grid>\n            <ion-row class=\"header\">\n              <ion-col class=\"col\" size=\"1\">no</ion-col>\n              <ion-col class=\"col\" size=\"2\">order</ion-col>\n              <ion-col class=\"col\" size=\"6\">ลูกค้า</ion-col>\n              <ion-col class=\"col\" size=\"2\"><div style=' text-align: center;'> <fa-icon icon=\"comment\"></fa-icon> </div></ion-col>\n              <ion-col class=\"col\" size=\"1\"><div style=' text-align: center;'> <fa-icon icon=\"map-marker\"></fa-icon> </div></ion-col>\n            </ion-row>\n            <ion-row class=\"row\" *ngFor=\"let data of orderdata;let idx = index\">\n              <ion-col class=\"col\" size=\"1\">{{data.no}}</ion-col>\n              <ion-col class=\"col\" size=\"2\">{{data.order}}</ion-col>\n              <ion-col class=\"col\" size=\"6\">{{data.customer_name}}</ion-col>\n              <ion-col class=\"col\" size=\"2\"></ion-col>\n              <ion-col class=\"col\" size=\"1\">{{data.dropNumber}}</ion-col>\n            </ion-row>\n          </ion-grid>\n        </div>\n      </ion-col>\n    </ion-row>\n  </ion-grid>\n</ion-content>\n\n\n<ion-footer no-shadow>\n  <ion-toolbar position=\"bottom\">\n    <section class=\"full-width\">\n      <ion-button\n        (click)=\"dismissModal();\"\n        expand=\"full\"\n        size=\"large\"\n        color=\"danger\"\n        >ปิด</ion-button\n      >\n    </section>\n  </ion-toolbar>\n</ion-footer>"
