module.exports = "<ion-header>\n  <ion-toolbar class=\"blues-nav\">\n    <ion-title>Add Drop</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content style=\"background: #fff\">\n\n  <div style=\"margin: 0.3rem\">\n    <div class=\"ion-grid\">\n      <ion-row>\n        <ion-col>\n          <ion-text style=\"font-size: 20px\"> รายการ : 1</ion-text>\n        </ion-col>\n      </ion-row>\n    </div>\n  </div>\n\n  <ion-grid>\n    <div class=\"ion-text-wrap\">\n\n      <h3 class=\"header-text\">\n        <span>\n          <ion-checkbox color=\"danger\" size=\"large\"></ion-checkbox> \n          Drop:1\n        </span>\n      </h3>\n\n      <h3 class=\"header-text\">\n        <span>\n          <ion-checkbox color=\"danger\" size=\"large\"></ion-checkbox>\n           Drop:2\n        </span>\n      </h3>\n\n\n    </div>\n  </ion-grid>\n</ion-content>\n\n<ion-footer no-shadow>\n  <ion-grid>\n    <ion-row>\n      <ion-col>\n        <ion-button expand=\"full\" color=\"danger\" size=\"large\" (click)=\"dismissModal()\">\n          ยกเลิก\n        </ion-button>\n       \n      </ion-col>\n      <ion-col>\n        <ion-button expand=\"full\" color=\"primary\" size=\"large\" (click)=\"addDrop();\">\n          เพิ่ม\n        </ion-button>\n      </ion-col>\n    </ion-row>\n  </ion-grid>\n</ion-footer>"
