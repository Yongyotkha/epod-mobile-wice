module.exports = "<ion-header>\n  <ion-toolbar class=\"blues-nav\">\n    <ion-buttons slot=\"start\" class=\"nav-content\">\n      <ion-menu-button></ion-menu-button>\n    </ion-buttons>\n    <ion-title>สินค้า</ion-title>\n  </ion-toolbar>\n</ion-header>\n\n<ion-content>\n\n  <div class=\"bg-blue\" style=\"background: #fff\">\n    <ion-grid class=\"ion-no-padding\">\n      <ion-row>\n        <ion-col size=\"12\">\n          <div class=\"card-container\">\n            <div class=\"card-summary\">\n              <img src=\"./../../assets/imgs/bill.png\" alt=\"\">\n              จำนวน 4 บิล\n            </div>\n            <div class=\"card-summary\">\n              <img src=\"./../../assets/imgs/parcel.png\" alt=\"\">\n              จำนวน 20 ชิ้น\n            </div>\n          </div>\n        </ion-col>\n      </ion-row>\n    </ion-grid>\n  </div>\n\n</ion-content>\n\n<ion-footer no-shadow>\n  <ion-toolbar position=\"bottom\">\n    <section class=\"full-width\">\n      <ion-button expand=\"full\" color=\"success\" (click)=\"Home();\">กลับไปหน้าแรก &nbsp; <fa-icon icon=\"check\"></fa-icon>\n      </ion-button>\n    </section>\n  </ion-toolbar>\n</ion-footer>"
